name: deploy
# Manual deploy from GitHub using short-lived AWS credentials (OIDC), so no access keys are stored.
# One-time setup: create an IAM role that trusts GitHub's OIDC provider for this repo, then add the
# repository variable AWS_ROLE_ARN. Optional variables: AWS_REGION (default ap-south-1), MODEL_ID.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - run: ./scripts/deploy.sh
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          MODEL_ID: ${{ vars.MODEL_ID }}
