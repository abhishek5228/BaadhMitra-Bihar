name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_REGION: ap-south-1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      # regenerate the vectors from the TypeScript; fail if the committed file is stale
      - run: npm run vectors
      - run: git diff --exit-code conformance
      - run: dotnet run -c Release --project dotnet/Conformance -- conformance/vectors.json

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: cd go && go vet ./... && go test ./...
      - run: cd rust && cargo test
      - run: javac -d /tmp/jc java/*.java && java -cp /tmp/jc Verify conformance/vectors.tsv
      - run: cd python && python3 -m unittest discover -s tests -t .
