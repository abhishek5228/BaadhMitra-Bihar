name: cwc-feed

# Turns the CWC daily flood bulletin PDFs you put in inbox/ into data/cwc-latest.json, the river-level file the
# gauge poller reads. cwc.gov.in answers automated downloads with HTTP 401, so the PDF is saved from a browser and
# uploaded to inbox/ (GitHub: Add file > Upload files). The newest bulletin by date wins.
on:
  push:
    paths:
      - 'inbox/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwc-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber
      - name: Read the newest bulletin in inbox/
        run: python3 scripts/cwc_bulletin.py inbox/*.pdf --out data/cwc-latest.json --meta data/cwc-latest.meta.json
      - name: Show what was read
        run: cat data/cwc-latest.meta.json
      - name: Commit if it changed
        run: |
          if git diff --quiet -- data; then
            echo "No change."
          else
            git config user.name "cwc-feed"
            git config user.email "cwc-feed@users.noreply.github.com"
            git add data
            git commit -m "Update river levels from the CWC bulletin"
            git pull --rebase
            git push
          fi
