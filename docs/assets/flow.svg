<text x="767" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">incidents, audit</text>
<g filter="url(#sh)"><polygon points="935,198 989,224 935,250 881,224" fill="#2fbf71"/><polygon points="881,224 935,250 935,296 881,270" fill="#2fbf71" opacity=".55"/><polygon points="989,224 935,250 935,296 989,270" fill="#2fbf71" opacity=".78"/></g>
