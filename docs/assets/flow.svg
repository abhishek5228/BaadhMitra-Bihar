<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="DejaVu Sans,Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233d"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="gl"><feGaussianBlur stdDeviation="3.5"/></filter></defs>
<rect width="1200" height="470" rx="18" fill="url(#bg)"/>
