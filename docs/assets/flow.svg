<text x="1103" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">field page</text>
<g><circle r="9" fill="#4da3ff" opacity=".55" filter="url(#gl)"/><circle r="5.5" fill="#4da3ff" stroke="#fff" stroke-width="1.5"/><animateMotion dur="14s" begin="-0.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#rt"/></animateMotion></g>
<g><circle r="9" fill="#2fe0b0" opacity=".55" filter="url(#gl)"/><circle r="5.5" fill="#2fe0b0" stroke="#fff" stroke-width="1.5"/><animateMotion dur="14s" begin="-3.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#rt"/></animateMotion></g>
<g><circle r="9" fill="#f5a524" opacity=".55" filter="url(#gl)"/><circle r="5.5" fill="#f5a524" stroke="#fff" stroke-width="1.5"/><animateMotion dur="14s" begin="-7.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#rt"/></animateMotion></g>
<g><circle r="9" fill="#e5484d" opacity=".55" filter="url(#gl)"/><circle r="5.5" fill="#e5484d" stroke="#fff" stroke-width="1.5"/><animateMotion dur="14s" begin="-10.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#rt"/></animateMotion></g>
<text x="95" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">1. text or voice arrives</text>
<text x="263" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">2. 30/hour per sender, hashed id</text>
<text x="431" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">3. buffered, retried, poison to DLQ</text>
<text x="599" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">4. rules always, Bedrock if enabled</text>
<text x="767" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">5. merge duplicates, optimistic lock</text>
<text x="935" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">6. queue, SLA chips, audit</text>
<text x="1103" y="165" text-anchor="middle" fill="#9aa8bf" font-size="10.5">7. progress taps, works offline</text>
<text x="600" y="400" text-anchor="middle" fill="#9aa8bf" font-size="12">also in the loop: Transcribe (voice), Polly (read-back), SNS (overdue alerts, once), EventBridge (5-minute SLA sweep), Cognito (4 roles), CloudWatch (alarms)</text>
<text x="600" y="425" text-anchor="middle" fill="#6f7f99" font-size="11">Region ap-southeast-2 for this deployment; every piece is serverless, nothing idles when no flood</text>
</svg>