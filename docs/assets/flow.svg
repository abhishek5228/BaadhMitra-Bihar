<path id="rt" d="M95 250 L263 250 L431 250 L599 250 L767 250 L935 250 L1103 250" stroke="#27344d" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
<g filter="url(#sh)"><polygon points="95,198 149,224 95,250 41,224" fill="#4da3ff"/><polygon points="41,224 95,250 95,296 41,270" fill="#4da3ff" opacity=".55"/><polygon points="149,224 95,250 95,296 149,270" fill="#4da3ff" opacity=".78"/></g>
<text x="95" y="332" text-anchor="middle" fill="#eef2f8" font-size="14" font-weight="700">Citizen</text>
<text x="95" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">phone / WhatsApp</text>
<g filter="url(#sh)"><polygon points="263,198 317,224 263,250 209,224" fill="#a78bfa"/><polygon points="209,224 263,250 263,296 209,270" fill="#a78bfa" opacity=".55"/><polygon points="317,224 263,250 263,296 317,270" fill="#a78bfa" opacity=".78"/></g>
<text x="263" y="332" text-anchor="middle" fill="#eef2f8" font-size="14" font-weight="700">API Gateway</text>
<text x="263" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">rate limit, WAF</text>
<g filter="url(#sh)"><polygon points="431,198 485,224 431,250 377,224" fill="#f5a524"/><polygon points="377,224 431,250 431,296 377,270" fill="#f5a524" opacity=".55"/><polygon points="485,224 431,250 431,296 485,270" fill="#f5a524" opacity=".78"/></g>
<text x="431" y="332" text-anchor="middle" fill="#eef2f8" font-size="14" font-weight="700">SQS + DLQ</text>
<text x="431" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">never lose a report</text>
<g filter="url(#sh)"><polygon points="599,198 653,224 599,250 545,224" fill="#2fe0b0"/><polygon points="545,224 599,250 599,296 545,270" fill="#2fe0b0" opacity=".55"/><polygon points="653,224 599,250 599,296 653,270" fill="#2fe0b0" opacity=".78"/></g>
