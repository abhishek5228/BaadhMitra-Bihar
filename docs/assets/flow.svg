<g filter="url(#sh)"><polygon points="1103,198 1157,224 1103,250 1049,224" fill="#e5484d"/><polygon points="1049,224 1103,250 1103,296 1049,270" fill="#e5484d" opacity=".55"/><polygon points="1157,224 1103,250 1103,296 1157,270" fill="#e5484d" opacity=".78"/></g>
