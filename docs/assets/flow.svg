<text x="599" y="350" text-anchor="middle" fill="#9aa8bf" font-size="11">place, people, needs</text>
<g filter="url(#sh)"><polygon points="767,198 821,224 767,250 713,224" fill="#4da3ff"/><polygon points="713,224 767,250 767,296 713,270" fill="#4da3ff" opacity=".55"/><polygon points="821,224 767,250 767,296 821,270" fill="#4da3ff" opacity=".78"/></g>
