<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="BaadhMitra: flood rescue triage for Bihar, animated banner with rain and rising water">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a16"/><stop offset="1" stop-color="#10223f"/></linearGradient>
    <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b7bff" stop-opacity=".85"/><stop offset="1" stop-color="#0b2a66" stop-opacity=".95"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ec8ff"/><stop offset="1" stop-color="#2fe0b0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff5a4d" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a4d" stop-opacity="0"/></radialGradient>
    <style>
      .rain{stroke:#8fc4ff;stroke-width:1.6;stroke-linecap:round;opacity:.55;animation:fall 1.1s linear infinite}
      @keyframes fall{from{transform:translate(0,-60px)}to{transform:translate(-26px,460px)}}
      .w1{animation:sway 6s ease-in-out infinite}.w2{animation:sway 8s ease-in-out infinite reverse}
      @keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-60px)}}
      .rise{animation:rise 9s ease-in-out infinite}
      @keyframes rise{0%,100%{transform:translateY(34px)}50%{transform:translateY(-16px)}}
      .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
      @keyframes pulse{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.4);opacity:0}}
      .boat{animation:boat 10s linear infinite}
      @keyframes boat{from{transform:translateX(-120px)}to{transform:translateX(1320px)}}
      .bob{animation:bob 1.6s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .fade{animation:fade 6s ease-in-out infinite}
      @keyframes fade{0%,100%{opacity:.35}50%{opacity:1}}
      text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif}
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- stars of data -->
  <g fill="#9fc2ff" class="fade"><circle cx="90" cy="60" r="1.5"/><circle cx="260" cy="30" r="1.2"/><circle cx="470" cy="70" r="1.4"/><circle cx="830" cy="40" r="1.3"/><circle cx="1010" cy="90" r="1.6"/><circle cx="1130" cy="35" r="1.2"/></g>
  <!-- distant hills -->
  <path d="M0 300 C120 250 220 290 340 255 C470 215 560 285 690 250 C820 214 930 280 1060 245 C1130 228 1170 250 1200 244 L1200 420 L0 420Z" fill="#12301f"/>
  <path d="M0 335 C150 300 260 340 400 312 C540 284 650 342 800 308 C940 276 1060 330 1200 300 L1200 420 L0 420Z" fill="#1a4a2c"/>
  <!-- incident beacons -->
  <g>
    <circle cx="300" cy="288" r="22" fill="url(#glow)" class="pulse"/><rect x="293" y="250" width="14" height="40" rx="6" fill="#ff6b4d"/>
    <circle cx="620" cy="292" r="20" fill="url(#glow)" class="pulse" style="animation-delay:.7s"/><rect x="613" y="262" width="14" height="32" rx="6" fill="#ff6b4d"/>
    <circle cx="905" cy="290" r="18" fill="url(#glow)" class="pulse" style="animation-delay:1.3s"/><rect x="898" y="258" width="14" height="34" rx="6" fill="#f5b942"/>
  </g>
  <!-- rising water -->
  <g class="rise">
    <g class="w2" opacity=".6"><path d="M-80 330 q60 -22 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 V520 H-80Z" fill="url(#wat)"/></g>
    <g class="w1"><path d="M-80 346 q60 -22 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 V520 H-80Z" fill="url(#wat)"/></g>
  </g>
  <!-- rescue boat -->
  <g class="boat"><g class="bob"><path d="M0 352 h64 l-10 14 h-44z" fill="#f4f7fb"/><rect x="26" y="332" width="4" height="20" fill="#f4f7fb"/><path d="M30 334 l22 8 h-22z" fill="#ff6b4d"/></g></g>
  <!-- rain -->
  <g>
    <g class="rain" style="animation-delay:0s"><line x1="60" y1="0" x2="50" y2="22"/><line x1="240" y1="0" x2="230" y2="22"/><line x1="420" y1="0" x2="410" y2="22"/><line x1="610" y1="0" x2="600" y2="22"/><line x1="790" y1="0" x2="780" y2="22"/><line x1="980" y1="0" x2="970" y2="22"/><line x1="1160" y1="0" x2="1150" y2="22"/></g>
    <g class="rain" style="animation-delay:-.35s"><line x1="140" y1="0" x2="130" y2="22"/><line x1="330" y1="0" x2="320" y2="22"/><line x1="520" y1="0" x2="510" y2="22"/><line x1="700" y1="0" x2="690" y2="22"/><line x1="880" y1="0" x2="870" y2="22"/><line x1="1070" y1="0" x2="1060" y2="22"/></g>
    <g class="rain" style="animation-delay:-.7s"><line x1="20" y1="0" x2="10" y2="22"/><line x1="200" y1="0" x2="190" y2="22"/><line x1="380" y1="0" x2="370" y2="22"/><line x1="570" y1="0" x2="560" y2="22"/><line x1="750" y1="0" x2="740" y2="22"/><line x1="940" y1="0" x2="930" y2="22"/><line x1="1120" y1="0" x2="1110" y2="22"/></g>
  </g>
  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-size="76" font-weight="800" fill="url(#ttl)">BaadhMitra</text>
  <text x="600" y="206" text-anchor="middle" font-size="38" font-weight="600" fill="#e7f0ff">बाढ़मित्र</text>
  <text x="600" y="246" text-anchor="middle" font-size="19" fill="#b7c8e6">Hindi voice &amp; text distress reports → one ranked rescue queue, on AWS</text>
</svg>
